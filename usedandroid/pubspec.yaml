name: usedandroid
description: Used - Buy and sell fashion items
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.3
  cached_network_image: ^3.4.1
  provider: ^6.1.5
  image_picker: ^1.1.2
  smooth_page_indicator: ^1.2.0+3
  intl: ^0.20.2
  flutter_svg: ^2.0.17
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1
  agora_rtc_engine: ^6.3.2
  web_socket_channel: ^3.0.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# App launcher icon (brand red + white USED wordmark)
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FC0E00"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# Splash screen (brand red background + white USED logo)
flutter_native_splash:
  color: "#FC0E00"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#FC0E00"
    image: "assets/icon/splash_logo.png"
