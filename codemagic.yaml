workflows:
  ios-device:
    name: iOS Device Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: com.usedis.app
    working_directory: usedandroid
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          flutter build ios \
            --release \
            --no-codesign
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iOS TestFlight (USED)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Must exactly match the App Store Connect API key name in the Codemagic
      # UI (Developer Portal integration). Here it is named "Codemagic".
      app_store_connect: Codemagic
    environment:
      flutter: 3.44.0
      xcode: latest
      cocoapods: default
      ios_signing:
        # Codemagic creates the distribution certificate + App Store profile
        # from the API key above and stores the certificate in your Codemagic
        # account, so it is reused automatically on every build.
        distribution_type: app_store
        bundle_identifier: com.usedis.app
    working_directory: usedandroid
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Prepare iOS project (pods + Flutter migrations)
        # Run the no-codesign build FIRST so all Flutter/Xcode project
        # migrations (SPM, UIScene, pbxproj upgrade) and pod install happen
        # BEFORE we apply signing. Otherwise the migration rewrites
        # project.pbxproj and wipes the signing config that use-profiles set.
        script: flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER
      - name: Set up code signing
        # The ios_signing block above makes Codemagic fetch/create + store the
        # certificate and profile; this applies them to the Xcode project.
        script: xcode-project use-profiles
      - name: Build & sign IPA
        # flutter build ipa respects the PROVISIONING_PROFILE_SPECIFIER that
        # use-profiles wrote into the project (xcode-project build-ipa forces
        # CODE_SIGN_STYLE=Manual but drops the specifier). The project is
        # already migrated in the step above, so nothing re-migrates here.
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
