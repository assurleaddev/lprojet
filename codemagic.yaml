workflows:
  ios-device:
    name: iOS Device Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: com.usedis.app
    working_directory: usedandroid
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Disable Swift Package Manager (Agora needs CocoaPods headers)
        # Flutter 3.44 auto-migrates projects to SPM, which integrates
        # agora_rtc_engine as an SPM target and leaves the pod-delivered
        # <AgoraRtcWrapper/AgoraPIPController.h> off the header search path
        # ("file not found"). Force the pure-CocoaPods path.
        script: flutter config --no-enable-swift-package-manager
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          flutter build ios \
            --release \
            --no-codesign
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iOS TestFlight (USED)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Must exactly match the App Store Connect API key name in the Codemagic
      # UI (Developer Portal integration). Here it is named "Codemagic".
      app_store_connect: Codemagic
    environment:
      groups:
        # Codemagic secure var group holding CERTIFICATE_PRIVATE_KEY — a
        # persistent RSA key so ONE distribution cert is reused across builds
        # (instead of creating a new cert every build and hitting Apple's cap).
        - signing
      flutter: 3.44.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.usedis.app"
    working_directory: usedandroid
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Disable Swift Package Manager (Agora needs CocoaPods headers)
        # Flutter 3.44 auto-migrates to SPM, which integrates agora_rtc_engine
        # as an SPM target and leaves the pod-delivered
        # <AgoraRtcWrapper/AgoraPIPController.h> off the header search path
        # ("file not found"). Force the pure-CocoaPods integration Agora expects.
        script: flutter config --no-enable-swift-package-manager
      - name: Prepare iOS project (pods + Flutter migrations)
        # Run the no-codesign build FIRST so all Flutter/Xcode project
        # migrations (UIScene, pbxproj upgrade) and pod install happen
        # BEFORE we apply signing. Otherwise the migration rewrites
        # project.pbxproj and wipes the signing config that use-profiles set.
        script: flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER
      - name: Set up code signing (reuse persistent cert)
        # Use the PERSISTENT private key from the CERTIFICATE_PRIVATE_KEY env
        # var so the distribution certificate is fetched/created ONCE and then
        # reused on every build — no per-build cert, no Apple cert-limit issues.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build & sign IPA
        # flutter build ipa respects the PROVISIONING_PROFILE_SPECIFIER that
        # use-profiles wrote into the project (xcode-project build-ipa forces
        # CODE_SIGN_STYLE=Manual but drops the specifier). The project is
        # already migrated in the step above, so nothing re-migrates here.
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
